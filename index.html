<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Калькулятор дробей</title>
</head>

<body>
    <div class="h1-background">
        <img src="img/logo.png" alt="logo" class="logo">
        <h1>Калькулятор дробей</h1>
    </div>

    <p class="info">На нашем сайте представлен удобный инструмент для проведения операций с простыми дробями.</p>
    <input type="number" id="numerator1">
    
    <select id="operation">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">×</option>
        <option value="/">÷</option>
    </select> 

    <input type="number" id="numerator2">
    <button id="calculate">Вычислить</button>
    <p>Результат: <span id="result"></span></p>

    <script src="script.js"></script>
</body>

</html>
